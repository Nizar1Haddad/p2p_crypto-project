<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P Cryptography Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1d2671, #c33764);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #333;
    }

    .card {
      background: #fff;
      width: 480px;
      padding: 25px 30px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      color: #1d2671;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
    }

    select, textarea, input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: none;
      height: 110px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      background: linear-gradient(135deg, #1d2671, #c33764);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .result {
      margin-top: 20px;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }

    footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🔐 P2P Crypto Messenger</h1>
    <p class="subtitle">Encrypt & send messages securely</p>

    <label for="cipher">Cipher</label>
    <select id="cipher">
      <option value="caesar">Caesar</option>
      <option value="affine">Affine</option>
      <option value="vigenere">Vigenère</option>
      <option value="transposition">Transposition</option>
      <option value="otp">One-Time Pad</option>
      <option value="rsa">RSA</option>
    </select>

    <label for="text">Message</label>
    <textarea id="text" placeholder="Type your message here..."></textarea>

    <label for="key">Key</label>
    <input id="key" placeholder="Example: 3 | 5,7 | LEMON | e,n">

    <button onclick="sendMessage()">Encrypt & Send</button>

    <div class="result" id="out">Waiting for message...</div>

    <footer>
      Network Cryptography Project
    </footer>
  </div>

  <script>
    function sendMessage() {
      const cipher = document.getElementById("cipher").value;
      const text = document.getElementById("text").value;
      const key = document.getElementById("key").value;
      const out = document.getElementById("out");

      if (!text || !key) {
        out.textContent = "⚠️ Please enter both message and key.";
        return;
      }

      fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cipher, text, key })
      })
      .then(res => res.json())
      .then(data => {
        out.textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        out.textContent = "❌ Error: " + err;
      });
    }
  </script>

</body>
</html>
