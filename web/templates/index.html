<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P2P Crypto Messenger</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #0b141a;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 0;
  font-family: Arial, sans-serif;
}

.app {
  width: 420px;
  max-width: 95vw;
  height: calc(100vh - 40px);
  background: #efeae2;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.header {
  background: #075e54;
  color: white;
  padding: 14px;
  font-weight: bold;
  text-align: center;
}

.chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 75%;
  padding: 8px;
  border-radius: 8px;
  font-size: 14px;
}

.sent {
  background: #dcf8c6;
  align-self: flex-end;
}

.received {
  background: white;
  align-self: flex-start;
}

.meta {
  font-size: 11px;
  color: #555;
}

.controls {
  padding: 8px;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

input, textarea, select, button {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

textarea {
  height: 60px;
}

button {
  background: #075e54;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">P2P Crypto Messenger</div>

  <div class="chat" id="chat"></div>

  <div class="controls">
    <input id="ip" placeholder="Receiver IP">
    <select id="cipher" onchange="updateKeyPlaceholder()">
      <option value="caesar">Caesar</option>
      <option value="affine">Affine</option>
      <option value="vigenere">Vigenere</option>
      <option value="transposition">Transposition</option>
      <option value="otp">OTP</option>
      <option value="rsa">RSA</option>
    </select>
    <textarea id="text" placeholder="Type a message"></textarea>
    <input id="key">
    <button onclick="sendMessage()">Encrypt & Send</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
let lastInboxLength = 0;
let userScrolledUp = false;

// Detect manual scrolling
chat.addEventListener("scroll", () => {
  const atBottom =
    chat.scrollHeight - chat.scrollTop <= chat.clientHeight + 5;
  userScrolledUp = !atBottom;
});

function updateKeyPlaceholder() {
  const c = cipher.value;
  const k = key;
  const map = {
    caesar: "Example: 3",
    affine: "Example: 5,7",
    vigenere: "Example: LEMON",
    transposition: "Example: 4",
    otp: "Example: XMCKL",
    rsa: "No key required"
  };
  k.placeholder = map[c];
  k.disabled = (c === "rsa");
  if (c !== "rsa") k.value = "";
}

function sendMessage() {
  if (!text.value || !ip.value) {
    alert("Please enter a message and receiver IP.");
    return;
  }

  fetch("/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      cipher: cipher.value,
      text: text.value,
      key: key.value,
      ip: ip.value
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) {
      alert(d.error);
      return;
    }

    const bubble = document.createElement("div");
    bubble.className = "msg sent";
    bubble.innerHTML = `
      <strong>You</strong><br>
      <div class="meta">Encrypted:</div>${d.encrypted}
      <div class="meta">Decrypted:</div>${text.value}
    `;
    chat.appendChild(bubble);

    setTimeout(() => {
      chat.scrollTop = chat.scrollHeight;
    }, 50);

    text.value = "";
  });
}

function loadInbox() {
  fetch("/inbox")
    .then(r => r.json())
    .then(data => {
      let newMessages = false;

      for (let i = lastInboxLength; i < data.length; i++) {
        const m = data[i];
        const bubble = document.createElement("div");
        bubble.className = "msg received";
        bubble.innerHTML = `
          <strong>${m.from}</strong><br>
          <div class="meta">Encrypted:</div>${m.encrypted}
          <div class="meta">Decrypted:</div>${m.decrypted}
        `;
        chat.appendChild(bubble);
        newMessages = true;
      }

      if (newMessages && !userScrolledUp) {
        chat.scrollTop = chat.scrollHeight;
      }

      lastInboxLength = data.length;
    });
}

setInterval(loadInbox, 500);
updateKeyPlaceholder();
</script>

</body>
</html>
